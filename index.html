<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warkop Prawinata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff4e6;
            margin: 0;
            text-align: center;
        }
        header {
            background: #6b351c;
            color: white;
            padding: 25px;
        }
        h1 { margin: 0; }
        .menu {
            background: white;
            margin: 20px;
            padding: 20px;
            border-radius: 12px;
        }
        button {
            background: #6b351c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
        }
        footer {
            background: #6b351c;
            color: white;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>WARKOP PRAWINATA</h1>
    <p>Murah, Enak, dan Mengenyangkan!</p>
</header>

<div class="menu">
    <h2>Menu Makanan</h2>
    <p>Kentang Goreng - Rp10.000</p>
    <p>Cireng - Rp8.000</p>
    <p>Bakso - Rp12.000</p>
    <p>Mie Goreng - Rp10.000</p>
    <p>Sosis Goreng - Rp8.000</p>
</div>

<div class="menu">
    <h2>Menu Minuman</h2>
    <p>Es Teh - Rp5.000</p>
    <p>Pop Ice - Rp6.000</p>
    <p>Kopi - Rp5.000</p>
    <p>Air Putih - Rp3.000</p>
</div>

<footer>
    <p>Warkop Prawinata</p>
    <p>Buka Setiap Hari</p>
</footer>

</body>
</html>
